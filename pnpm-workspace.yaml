packages:
  - "."

allowBuilds:
  "@prisma/engines": true
  "@sentry/cli": true
  esbuild: true
  msw: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Suelos de seguridad (Dependabot críticas/altas 2026-10).
# Selectores por major para no colapsar líneas incompatibles (js-yaml 3 vs 4, brace-expansion 1/2/5).
overrides:
  "brace-expansion@1": "1.1.21"
  "brace-expansion@2": "2.1.7"
  "brace-expansion@5": "5.0.12"
  "js-yaml@3": "3.15.2"
  "js-yaml@4": "4.3.2"
  "fast-uri@3": "3.1.9"
  "postcss": "8.5.31"
  "source-map-js": "1.2.2"
  # GHSA-3f6p-5ww8-9rcr / GHSA-rgwj-5xj2-c3m3; padre Prisma no fuerza ≥3.23
  "mysql2": "3.23.1"
  # GHSA-ggr8-5vv4-36mx; major transitiva admitida por Prisma 7.10
  "deepmerge-ts": "8.0.0"
