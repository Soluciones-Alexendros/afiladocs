# Escáner de secretos + SCA (auditoría nativa + OSV).
# Secretos: patrón Alexendros/alexendrosdev (binario gitleaks; no gitleaks-action).
# SCA: pnpm audit --prod --audit-level=high + OSV-Scanner sobre el lockfile.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Binario gitleaks (no la action de pago). Checksum release v8.30.1.
      - name: gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  sca:
    name: sca
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Placeholders (no secretos): postinstall `prisma generate` exige
    # DIRECT_URL/DATABASE_URL. Mismos valores que ci.yml.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      NEXT_PUBLIC_SITE_URL: https://afiladocs.com
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      RESEND_API_KEY: re_placeholder
      CRON_SECRET: placeholder
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Detect lockfile
        id: lockfile
        run: |
          set -euo pipefail
          if [[ -f pnpm-lock.yaml ]]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [[ -f package-lock.json ]]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
          elif [[ -f Cargo.lock ]]; then
            echo "manager=cargo" >> "$GITHUB_OUTPUT"
            echo "lockfile=Cargo.lock" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No supported lockfile found (pnpm-lock.yaml, package-lock.json, Cargo.lock)"
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.lockfile.outputs.manager == 'pnpm'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.lockfile.outputs.manager == 'pnpm' || steps.lockfile.outputs.manager == 'npm'
        with:
          node-version-file: ".nvmrc"
          cache: ${{ steps.lockfile.outputs.manager }}

      - name: Install dependencies (pnpm)
        if: steps.lockfile.outputs.manager == 'pnpm'
        run: pnpm install --frozen-lockfile
      - name: Native audit (pnpm)
        if: steps.lockfile.outputs.manager == 'pnpm'
        run: pnpm audit --prod --audit-level=high

      - name: Native audit (npm)
        if: steps.lockfile.outputs.manager == 'npm'
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: Native audit (cargo)
        if: steps.lockfile.outputs.manager == 'cargo'
        run: |
          set -euo pipefail
          if command -v cargo-deny >/dev/null 2>&1; then
            cargo deny check advisories
          else
            cargo install cargo-audit --locked
            cargo audit
          fi

      # Binario osv-scanner v1.9.0 (no flag --severity en esta versión).
      # Fallamos solo si hay HIGH/CRITICAL en database_specific.severity.
      - name: OSV-Scanner (high/critical only)
        run: |
          set -euo pipefail
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v1.9.0/osv-scanner_linux_amd64
          echo "d9c1deedc23372a25049458e1e2f2bb9ad4098e2e2038118b9fec42f28f93ffb  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          set +e
          ./osv-scanner --lockfile="${{ steps.lockfile.outputs.lockfile }}" --format=json --output=osv-results.json
          osv_exit=$?
          set -e
          if [[ ! -f osv-results.json ]]; then
            echo "::error::OSV-Scanner no generó osv-results.json (exit ${osv_exit})"
            exit 1
          fi
          python3 - <<'PY'
          import json
          import sys
          data = json.load(open("osv-results.json", encoding="utf-8"))
          bad = []
          for result in data.get("results", []):
              for pkg in result.get("packages", []):
                  name = (pkg.get("package") or {}).get("name", "?")
                  version = (pkg.get("package") or {}).get("version", "?")
                  for vuln in pkg.get("vulnerabilities", []):
                      sev = (vuln.get("database_specific") or {}).get("severity")
                      if sev in ("HIGH", "CRITICAL"):
                          bad.append(f"{sev} {vuln.get('id')} {name}@{version}")
          if bad:
              print("OSV high/critical findings:")
              for line in bad:
                  print(f"  - {line}")
              sys.exit(1)
          print("OSV: 0 high/critical (medium/low ignored by gate)")
          PY
