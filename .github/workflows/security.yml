# Escáner de secretos + SCA (auditoría nativa + OSV).
# Secretos: patrón Alexendros/alexendrosdev (binario gitleaks; no gitleaks-action).
# SCA: pnpm audit --prod --audit-level=high + OSV-Scanner sobre el lockfile.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Binario gitleaks (no la action de pago). Checksum release v8.30.1.
      - name: gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  sca:
    name: sca
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Detect lockfile
        id: lockfile
        run: |
          set -euo pipefail
          if [[ -f pnpm-lock.yaml ]]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [[ -f package-lock.json ]]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
          elif [[ -f Cargo.lock ]]; then
            echo "manager=cargo" >> "$GITHUB_OUTPUT"
            echo "lockfile=Cargo.lock" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No supported lockfile found (pnpm-lock.yaml, package-lock.json, Cargo.lock)"
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.lockfile.outputs.manager == 'pnpm'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.lockfile.outputs.manager == 'pnpm' || steps.lockfile.outputs.manager == 'npm'
        with:
          node-version-file: ".nvmrc"
          cache: ${{ steps.lockfile.outputs.manager }}

      - name: Install dependencies (pnpm)
        if: steps.lockfile.outputs.manager == 'pnpm'
        run: pnpm install --frozen-lockfile

      - name: Native audit (pnpm)
        if: steps.lockfile.outputs.manager == 'pnpm'
        run: pnpm audit --prod --audit-level=high

      - name: Native audit (npm)
        if: steps.lockfile.outputs.manager == 'npm'
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: Native audit (cargo)
        if: steps.lockfile.outputs.manager == 'cargo'
        run: |
          set -euo pipefail
          if command -v cargo-deny >/dev/null 2>&1; then
            cargo deny check advisories
          else
            cargo install cargo-audit --locked
            cargo audit
          fi

      - name: OSV-Scanner (high/critical only)
        uses: google/osv-scanner-action/osv-scanner-action@19ec1116569a47416e11a45848722b1af31a857b # v1.9.0
        with:
          scan-args: |-
            --lockfile=${{ steps.lockfile.outputs.lockfile }}
            --severity=high
